name: upload
on:
  push:
    branches: [shop-images]
    paths: [up/cmd.sh]
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash up/cmd.sh || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add up && git commit -m "upload result" && git push
