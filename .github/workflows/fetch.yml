name: fetch-shop-images
on:
  push:
    branches: [shop-images]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img
          while read id url; do [ -n "$id" ] && curl -sSL --fail "${url}&width=500" -o "img/$id.jpg" || echo "fail $id"; done < urls.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add img && git commit -m "images" && git push
